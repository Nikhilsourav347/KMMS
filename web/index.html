<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="Unique Knitting Mills operations and production management.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3568A8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Unique Knitting Mills">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Unique Knitting Mills</title>
  <style>
    body { margin: 0; background: #FFF8E7; }
    #startup { position: fixed; inset: 0; display: grid; align-content: center; justify-items: center; gap: 19px; color: #202731; font: 700 clamp(22px, 4vw, 35px) system-ui, sans-serif; }
    #startup img { width: 106px; height: 106px; border-radius: 22px; animation: appear .36s ease-out both; }
    #startup progress { width: 106px; height: 5px; accent-color: #3568A8; }
    @keyframes appear { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #startup img { animation: none; } }
  </style>
</head>
<body>
  <div id="startup"><img src="icons/Icon-192.png" alt=""><strong>Unique Knitting Mills</strong><progress aria-label="Initializing"></progress></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('startup')?.remove(), {once:true});
    // Retire caches created by older PWA builds. Supabase auth lives in
    // localStorage, so this intentionally leaves the valid cloud session alone.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (const registration of registrations) {
          if (registration.scope.startsWith(document.baseURI)) registration.unregister();
        }
      });
    }
    if ('caches' in window && document.baseURI.includes('/KMMS/')) {
      for (const name of ['flutter-app-manifest', 'flutter-temp-cache', 'flutter-app-cache']) {
        caches.delete(name);
      }
    }
    try {
      localStorage.removeItem('ukm.offline.session');
      localStorage.removeItem('flutter.ukm_onboarding_complete_v1');
      localStorage.removeItem('ukm_onboarding_complete_v1');
    } catch (_) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
