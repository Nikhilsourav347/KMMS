name: ukm
description: Operations and production management for Unique Knitting Mills.
publish_to: none
version: 1.2.0+12
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: '>=3.0.0 <4.0.0'
  sembast: ^3.8.6
  sembast_web: ^2.4.4+1
  path_provider: ^2.1.5
  cryptography: ^2.8.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  pdf: ^3.11.0
  # image 4.11 starts using an archive API outside PDF 3.12's archive constraint.
  image: 4.10.2
  printing: ^5.14.0
  file_saver: '>=0.3.1 <0.8.0'
  share_plus: '>=12.0.2 <14.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/company_logo.jpg
    - assets/fonts/roboto-regular.ttf
    - assets/fonts/roboto-bold.ttf
    - assets/fonts/roboto_license.txt
  fonts:
    - family: Mill Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
